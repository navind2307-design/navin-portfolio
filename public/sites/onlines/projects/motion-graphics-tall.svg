    <text x="82" y="436" fill="none" stroke="#e94bff" stroke-width="2" opacity="0.45" font-family="Inter, Arial, Helvetica, sans-serif" font-size="190" font-weight="800" letter-spacing="-8">MOTION</text>
    <text x="56" y="428" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="190" font-weight="800" letter-spacing="-8">MOTION</text>
    <text x="80" y="560" fill="#94ffaf" font-family="Inter, Arial, Helvetica, sans-serif" font-size="82" font-weight="600" letter-spacing="16">STORY</text>
