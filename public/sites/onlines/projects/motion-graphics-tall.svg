<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1300" width="700" height="1300" role="img" aria-label="Motion graphics and visual storytelling">
  <defs>
    <linearGradient id="mt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030307"/>
      <stop offset="0.55" stop-color="#0a0618"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <radialGradient id="mt-glow1" cx="0.25" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#1f6bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mt-glow2" cx="0.8" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#e94bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e94bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d6ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#38d6ff"/>
      <stop offset="0.75" stop-color="#94ffaf"/>
      <stop offset="1" stop-color="#94ffaf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mt-ribbon2" x1="0" y1="0" x2="1" y2="0">
