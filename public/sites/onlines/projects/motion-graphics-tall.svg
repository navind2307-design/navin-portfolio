  <path d="M-40 1110C150 990 270 1250 450 1100C580 994 650 1050 760 960" stroke="url(#mt-ribbon2)" stroke-width="2" fill="none" opacity="0.8"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
