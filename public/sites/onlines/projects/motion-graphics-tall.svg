      <stop offset="0.5" stop-color="#e94bff"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="700" height="1300" fill="url(#mt-bg)"/>
