      <stop offset="1" stop-color="#0a3ea6"/>
    </linearGradient>
    <radialGradient id="gt-glow" cx="0.55" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2d7dff" stop-opacity="0.8"/>
