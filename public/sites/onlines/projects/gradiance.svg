<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Gradiance video color grading app">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050f"/>
      <stop offset="0.5" stop-color="#061640"/>
      <stop offset="1" stop-color="#0a3ea6"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.72" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2d7dff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2d7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4b4b"/>
      <stop offset="0.18" stop-color="#ffb03a"/>
      <stop offset="0.36" stop-color="#f5e663"/>
      <stop offset="0.52" stop-color="#5bff9d"/>
      <stop offset="0.7" stop-color="#38d6ff"/>
      <stop offset="0.85" stop-color="#4b6bff"/>
      <stop offset="1" stop-color="#e45cff"/>
    </linearGradient>
    <linearGradient id="g-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1634"/>
      <stop offset="1" stop-color="#060b1d"/>
    </linearGradient>
    <linearGradient id="g-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5cff"/>
      <stop offset="0.5" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172344"/>
      <stop offset="1" stop-color="#0a0f22"/>
