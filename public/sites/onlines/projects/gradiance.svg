    <path d="M160 0V1000M360 0V1000M560 0V1000M760 0V1000M960 0V1000M1160 0V1000"/>
  </g>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="80" y="170" fill="#94ffaf" font-size="20" letter-spacing="6">01 / MOBILE PRODUCT</text>
    <text x="76" y="284" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-3">GRADIANCE</text>
    <text x="80" y="336" fill="#9db8ff" font-size="24" letter-spacing="7">VIDEO COLOR GRADING APP</text>
    <text x="80" y="432" fill="#c9d6ff" font-size="22" opacity="0.72">Cinematic color, in your pocket.</text>
    <text x="80" y="468" fill="#c9d6ff" font-size="22" opacity="0.72">Color wheels, scopes and looks.</text>

