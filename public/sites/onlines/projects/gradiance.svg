    <g transform="translate(60 632)">
      <rect width="260" height="18" rx="9" fill="#101b3a"/>
      <rect width="132" height="18" rx="9" fill="#94ffaf" opacity="0.9"/>
      <circle cx="132" cy="9" r="12" fill="#ffffff"/>
    </g>

    <g transform="translate(60 690)" fill="#0e1832">
      <rect width="112" height="44" rx="10"/>
      <rect x="124" width="112" height="44" rx="10"/>
      <rect x="248" width="12" height="44" rx="6"/>
