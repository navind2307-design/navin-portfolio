  <g opacity="0.9">
    <circle cx="1110" cy="850" r="14" fill="#ff6a3d"/>
    <circle cx="1148" cy="850" r="14" fill="#94ffaf"/>
    <circle cx="1072" cy="850" r="14" fill="#38d6ff"/>
